name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"
      - "module/**"
      - "template.json"
      - "scripts/validate-wiki.mjs"
      - "package.json"
  pull_request:
    paths:
      - "docs/wiki/**"
      - "module/**"
      - "template.json"
      - "scripts/validate-wiki.mjs"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate wiki
        run: npm run docs:check
